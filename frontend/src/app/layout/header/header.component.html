<header class="tp-header">
  <div class="header-left">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
      </svg>
      <input
        type="text"
        placeholder="Search tickets by ID, title, or keywords..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
      />
    </div>
  </div>

  <div class="header-right">
    <!-- Notification Bell Dropdown -->
    <div class="notification-wrapper">
      <button class="icon-btn" (click)="toggleNotifications()" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span *ngIf="notificationService.unreadCount() > 0" class="badge-count">
          {{ notificationService.unreadCount() }}
        </span>
      </button>

      <!-- Dropdown Popup -->
      <div *ngIf="showNotificationsDropdown()" class="notifications-dropdown">
        <div class="dropdown-header">
          <h4>Notifications</h4>
          <button *ngIf="notificationService.unreadCount() > 0" class="text-btn" (click)="markAllAsRead()">
            Mark all read
          </button>
        </div>

        <div *ngIf="loadingNotifications()" class="dropdown-loading">
          <span class="spinner-small"></span> Loading...
        </div>

        <div *ngIf="!loadingNotifications() && recentNotifications().length === 0" class="dropdown-empty">
          <p>No notifications</p>
        </div>

        <div *ngIf="!loadingNotifications() && recentNotifications().length > 0" class="notifications-list">
          <div
            *ngFor="let item of recentNotifications()"
            class="notification-item"
            [class.unread]="!item.is_read"
            (click)="markAsRead(item, $event)"
          >
            <div class="notif-indicator" [class.active]="!item.is_read"></div>
            <div class="notif-content">
              <div class="notif-title">{{ item.title }}</div>
              <div class="notif-msg">{{ item.message }}</div>
              <div class="notif-time">{{ item.created_at | date:'shortTime' }}</div>
            </div>
          </div>
        </div>

        <div class="dropdown-footer">
          <a routerLink="/notifications" (click)="showNotificationsDropdown.set(false)">
            View all notifications →
          </a>
        </div>
      </div>
    </div>

    <!-- User Profile & Role Badge -->
    <div class="user-profile" *ngIf="authService.currentUser() as user">
      <div class="user-avatar">
        {{ user.first_name ? user.first_name.charAt(0).toUpperCase() : user.email.charAt(0).toUpperCase() }}
      </div>
      <div class="user-details">
        <span class="user-name">{{ user.full_name }}</span>
        <span class="tp-badge" [ngClass]="getRoleBadgeClass(user.role)">
          {{ user.role }}
        </span>
      </div>
    </div>
  </div>
</header>
