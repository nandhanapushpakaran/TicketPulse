<aside class="tp-sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon">
        <span class="pulse-core"></span>
      </div>
      <div class="brand-text">
        <span class="brand-title">TicketPulse</span>
        <span class="brand-tag">COMMAND CENTER</span>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-title">CORE OPERATIONS</div>

    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="9"></rect>
        <rect x="14" y="3" width="7" height="5"></rect>
        <rect x="14" y="12" width="7" height="9"></rect>
        <rect x="3" y="16" width="7" height="5"></rect>
      </svg>
      <span>Dashboard</span>
    </a>

    <a routerLink="/tickets" [queryParams]="{ my_tickets: true }" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7.5" r="4"></circle>
        <polyline points="17 11 19 13 23 9"></polyline>
      </svg>
      <span>My Tickets</span>
    </a>

    <a routerLink="/tickets" [queryParams]="{}" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>All Tickets</span>
    </a>

    <a routerLink="/tickets/new" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      <span>Create Ticket</span>
    </a>

    <div class="nav-section-title">INSIGHTS & ADMIN</div>

    <a routerLink="/reports" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Reports</span>
    </a>

    <a routerLink="/notifications" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span>Notifications</span>
    </a>

    <!-- Admin Only Link -->
    <a *ngIf="authService.isAdmin()" routerLink="/users" routerLinkActive="active" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span>Users (Admin)</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-brief" *ngIf="authService.currentUser() as user">
      <div class="user-meta">
        <span class="brief-name">{{ user.full_name }}</span>
        <span class="brief-email">{{ user.email }}</span>
      </div>
    </div>

    <button class="logout-btn" (click)="onLogout()" title="Sign out of TicketPulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Logout</span>
    </button>
  </div>
</aside>
